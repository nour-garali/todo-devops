apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-devops
  labels:
    app: todo-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-devops
  template:
    metadata:
      labels:
        app: todo-devops
    spec:
      containers:
      - name: todo-devops
        image: nourgarali/todo-devops:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
